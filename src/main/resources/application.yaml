spring:
  application:
    name: Gestor_Salud

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
     hibernate:
      format_sql: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}

  jackson:
    json:
      read:
        allow-single-quotes: true
        allow-trailing-comma: true

jwt:
 expiration: ${JWT_EXPIRATION}
 refresh-expiration: ${JWT_REFRESH_EXPIRATION}
 secret: ${JWT_SECRET}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  recuperacion:
    minutos-validez: ${RECUPERACION_MINUTOS_VALIDEZ:30}
    max-solicitudes-por-hora: ${RECUPERACION_MAX_SOLICITUDES_POR_HORA:3}